type: object
description: >
  SpecForge Tasks 阶段输出报告 Schema (Article)。  
  ⚠️ 所有长文本字段（如 summary、background 等）必须使用 YAML 多行块格式：
  
  示例：
  
  summary: |
    这里是第一行
    这里是第二行
  
  ❌ 禁止使用双引号 " 包裹长文本

required:
  - summary
  - phases
  - stories

properties:
  # =========================
  # 0. Summary
  # =========================
  summary:
    type: object
    description: 全局统计信息
    required:
      - total_tasks
      - phase_count
      - story_count
    properties:
      total_tasks:
        type: integer
        description: 所有任务总数（必须 >= 1）
      phase_count:
        type: integer
        description: 阶段数量（通常 >= 3：Setup/Foundation/Story/Polish）
      story_count:
        type: integer
        description: Story（内容单元）数量

  # =========================
  # 1. Phases（摘要层，不承载任务）
  # =========================
  phases:
    type: array
    description: >
      阶段定义列表（来自 Plan 的结构分层）。
      必须包含：Setup / Foundation / Story / Polish
    minItems: 3
    items:
      type: object
      required:
        - name
        - order
        - purpose
        - task_count
      properties:
        name:
          type: string
          description: 阶段名称
          example: Setup
        order:
          type: integer
          description: 阶段顺序（从 1 开始递增）
        purpose:
          type: string
          description: 阶段目标（来自 Plan，不是内容）
        task_count:
          type: integer
          description: 当前阶段任务数量

  # =========================
  # 2. Setup
  # =========================
  setup:
    type: object
    description: >
      Phase 1: Setup（初始化阶段）
      用于建立基础约束（风格、结构、规范等）
    required:
      - purpose
      - task_count
      - tasks
    properties:
      purpose:
        type: string
        description: 阶段目标（对应模板中的 setup.purpose）
      task_count:
        type: integer
        description: 任务数量

      tasks:
        type: array
        description: Setup 阶段任务列表
        minItems: 1
        items:
          $ref: "#/definitions/task"

  # =========================
  # 3. Foundation
  # =========================
  foundation:
    type: object
    description: >
      Phase 2: Foundation（基础阶段）
      ⚠️ 所有 Story 任务必须依赖该阶段完成

    required:
      - purpose
      - task_count
      - tasks
    properties:
      purpose:
        type: string
        description: 阶段目标
      task_count:
        type: integer
      tasks:
        type: array
        minItems: 1
        items:
          $ref: "#/definitions/task"

    # =========================
    # 4. Stories
    # =========================
    stories:
      type: array
      description: >
        Story（核心执行单元）。
        每个 Story：
        - 必须可独立完成
        - 必须有独立验证方式
        - 包含完整 tasks 列表

      minItems: 1

      items:
        type: object
        required:
          - story_id
          - priority
          - goal
          - independent_test
          - task_count
          - tasks

        properties:

          story_id:
            type: string
            pattern: "^Story-[0-9]+$"
            description: Story ID

          priority:
            type: string
            enum: [ P1, P2, P3 ]
            description: 优先级（P1 = MVP）

          goal:
            type: string
            description: Story 目标（功能性）

          independent_test:
            type: string
            description: 如何独立验证该 Story 完成

          task_count:
            type: integer

          tasks:
            type: array
            description: 当前 Story 的任务列表
            minItems: 1
            items:
              $ref: "#/definitions/task"


    # =========================
    # 5. Polish（增强）
    # =========================
    polish:
      type: object
      description: >
        Final Phase: Polish（收尾阶段）
        - 跨 Story 优化
        - 风格统一
        - 一致性修复

      required:
        - purpose
        - task_count
        - tasks

      properties:
        purpose:
          type: string

        task_count:
          type: integer

        tasks:
          type: array
          items:
            $ref: "#/definitions/task"


# =========================
# 9. 任务定义（抽出复用）
# =========================
definitions:
  task:
    type: object
    description: >
      单个任务定义（原子任务，不可再拆分）。
      每一项必须是"可执行任务"，而不是描述性文本。
      ⚠️ 每个任务必须：
      - 独立执行
      - 有输入 → 有动作 → 有输出 → 可验证
      - 不能依赖"人类理解"
    required:
      - id
      - phase
      - story
      - description
      - path
      - depends
      - goal
      - action
      - output
      - acceptance

    properties:
      id:
        description: >
          任务唯一 ID。
          
          📌 规则：
          - 必须全局唯一
          - 按执行顺序递增
          
          示例：
          - TASK-101
          - TASK-102
        pattern: "^TASK-[0-9]+$"
        example: TASK-101
      phase:
        type: string
        description: 阶段标识（P1/P2/P3/...）
      description:
        type: string
        description: 任务一句话描述（简洁清晰）
      path:
        type: string
        description: 输出文件路径（必须明确）
      depends:
        type: array
        description: >
          依赖任务 ID 列表（DAG 结构）。

          📌 规则：
          - 无依赖必须写 []
          - 只能依赖已存在任务
          - 不允许循环依赖
        items:
          type: string
          pattern: "^TASK-[0-9]+$"
        default: [ ]
      status:
        type: string
        description: >
          任务执行状态：
          - 空（""）= 未执行（默认）
          - pending = 等待执行
          - doing = 执行中
          - completed = 已完成
          - failed = 执行失败
        enum: [ "", "pending", "doing", "completed", "failed" ]
        default: ""
      goal:
        type: string
        description: 任务目标（必须可执行）
      action:
        type: array
        description: >
          执行步骤列表（必须是动词开头）。
          建议 2-5 条。
        items:
          type: string
      output:
        type: array
        description: >
          输出产物（文件 / 内容）。
        items:
          type: string
      acceptance:
        type: array
        description: >
          验收标准（必须可判断成功/失败）。
        items:
          type: string

additionalProperties: false
