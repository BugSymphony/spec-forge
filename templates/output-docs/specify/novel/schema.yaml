type: object
description: >
  小说大纲结构化数据，用于生成完整小说策划文档
  ⚠️ 所有长文本字段（如 summary、background 等）必须使用 YAML 多行块格式：
  
  示例：
  
  summary: |
    这里是第一行
    这里是第二行
  
  ❌ 禁止使用双引号 " 包裹长文本

properties:
  title:
    type: string
    description: 小说标题，用于文档开头展示
  status:
    type: string
    description: 当前状态，例如 Draft / Final
    default: Draft
  version:
    type: string
    description: 文档版本号，例如 1.0
    default: "1.0"
  world_building:
    type: object
    description: 世界观设定
    properties:
      setting:
        type: string
        description: 故事背景，描述地理环境、社会结构、文化特色（200-300字）
      time_period:
        type: string
        description: 时代背景，说明历史阶段、科技水平等（50-100字）
      magic_system:
        type: string
        description: 魔法或科技体系，包含规则、限制、等级划分（150-250字）
      rules:
        type: array
        description: 世界规则列表，每条规则描述世界运行的核心逻辑
        items:
          type: string
          description: 单条世界规则（50-80字）
  characters:
    type: array
    description: 主要角色列表（建议 3-5 个角色）
    items:
      type: object
      properties:
        name:
          type: string
          description: 角色名称
        role:
          type: string
          description: 角色定位，例如 主角 / 反派 / 导师 / 盟友
        traits:
          type: array
          description: 性格特征列表，每条需体现行为或具体表现
          items:
            type: string
            description: 单条性格特征（需具体）
        background:
          type: string
          description: 背景故事，包括成长经历和关键转折点（100-150字）
        abilities:
          type: array
          description: 角色能力或技能列表
          items:
            type: string
            description: 单项能力，建议包含使用条件或限制
  plot:
    type: object
    description: 剧情结构设计
    properties:
      main_conflict:
        type: object
        description: 核心冲突设定
        properties:
          protagonist_goal:
            type: string
            description: 主角目标，需要具体、明确、可衡量
          antagonist:
            type: string
            description: 反派或主要阻碍力量，可以是人物或环境/内心冲突
          stakes:
            type: string
            description: 失败代价，说明如果目标失败会带来的严重后果
      story_arc:
        type: string
        description: 故事结构类型，例如 英雄之旅 / 三幕式 / 起承转合
      chapters:
        type: array
        description: 章节规划列表（建议 10-15 章）
        items:
          type: object
          properties:
            number:
              type: integer
              description: 章节编号（从1开始递增）
            title:
              type: string
              description: 章节标题，需要吸引人并暗示内容
            summary:
              type: string
              description: 章节摘要（100-150字），包含关键事件和悬念
  style:
    type: object
    description: 风格设定
    properties:
      tone:
        type: string
        description: 整体基调，例如 轻松 / 黑暗 / 热血 / 浪漫
      pov:
        type: string
        description: 叙事视角，例如 第一人称 / 第三人称限知 / 多视角
      pacing:
        type: string
        description: 节奏控制，例如 快节奏 / 慢节奏 / 张弛有度
  constraints:
    type: object
    description: 创作约束条件
    properties:
      word_count:
        type: object
        description: 篇幅要求
        properties:
          min:
            type: integer
            description: 最少总字数
          max:
            type: integer
            description: 最多总字数
      target_audience:
        type: string
        description: 目标读者群体，例如年龄段或兴趣人群
      forbidden_elements:
        type: array
        description: 禁止出现的内容列表
        items:
          type: string
          description: 单条禁止元素说明

required:
  - title
  - world_building
  - characters
  - plot
  - style
  - constraints