type: object
description: >
  漫画大纲结构化数据，用于生成完整漫画策划文档
  ⚠️ 所有长文本字段（如 summary、background 等）必须使用 YAML 多行块格式：
  
  示例：
  
  summary: |
    这里是第一行
    这里是第二行
  
  ❌ 禁止使用双引号 " 包裹长文本

properties:
  title:
    type: string
    description: 漫画标题，用于文档开头展示
  status:
    type: string
    description: 当前状态，例如 Draft / Final
    default: Draft
  version:
    type: string
    description: 文档版本号，例如 1.0
    default: "1.0"
  world_building:
    type: object
    description: 世界观设定
    properties:
      setting:
        type: string
        description: 故事背景，描述地理环境、社会结构、视觉特色（200-300 字）
      time_period:
        type: string
        description: 时代背景，说明历史阶段、科技水平、美术风格参考（50-100 字）
      power_system:
        type: string
        description: 力量体系，包含规则、视觉效果、限制（150-250 字）
      rules:
        type: array
        description: 世界规则列表
        items:
          type: string
          description: 单条世界规则（50-80 字）
  characters:
    type: array
    description: 主要角色列表（建议 3-5 个角色）
    items:
      type: object
      properties:
        name:
          type: string
          description: 角色名称
        role:
          type: string
          description: 角色定位，例如 主角/反派/盟友
        appearance:
          type: string
          description: 外貌特征（发型、发色、瞳色、体型、服装）
        traits:
          type: array
          description: 性格特征列表
          items:
            type: string
        background:
          type: string
          description: 背景故事（100-150 字）
        abilities:
          type: array
          description: 能力/技能列表
          items:
            type: string
  plot:
    type: object
    description: 剧情结构设计
    properties:
      main_conflict:
        type: object
        description: 核心冲突设定
        properties:
          protagonist_goal:
            type: string
            description: 主角目标
          antagonist:
            type: string
            description: 反派或阻碍力量
          stakes:
            type: string
            description: 失败代价
      story_arc:
        type: string
        description: 故事结构类型
      pages:
        type: array
        description: 分页规划（建议 20-30 页）
        items:
          type: object
          properties:
            number:
              type: integer
              description: 页码编号
            title:
              type: string
              description: 页面标题
            summary:
              type: string
              description: 页面摘要（包含关键动作、对话、情绪）
  style:
    type: object
    description: 美术风格
    properties:
      art_style:
        type: string
        description: 画风（如日式少年漫/少女漫/美式漫画）
      color_scheme:
        type: string
        description: 色彩方案（黑白/彩色、主色调）
      panel_layout:
        type: string
        description: 分格方式（传统日漫/韩漫长条/美漫大格）
  constraints:
    type: object
    description: 约束条件
    properties:
      page_count:
        type: object
        description: 篇幅要求
        properties:
          total:
            type: integer
            description: 总页数
          panels_per_page:
            type: string
            description: 单页分镜数范围
          dialogue_limit:
            type: string
            description: 单页对话量限制
      target_audience:
        type: string
        description: 目标读者群体
      forbidden_elements:
        type: array
        description: 禁止出现的内容列表
        items:
          type: string

required:
  - title
  - world_building
  - characters
  - plot
  - style
  - constraints
