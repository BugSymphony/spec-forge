type: object
description: >
  文章大纲结构化数据，用于生成完整内容策划文档
  ⚠️ 所有长文本字段（如 summary、background 等）必须使用 YAML 多行块格式：
  
  示例：
  
  summary: |
    这里是第一行
    这里是第二行
  
  ❌ 禁止使用双引号 " 包裹长文本

properties:
  title:
    type: string
    description: 文章标题，用于文档开头展示
  status:
    type: string
    description: 当前状态，例如 Draft / Final
    default: Draft
  version:
    type: string
    description: 文档版本号，例如 1.0
    default: "1.0"
  topic_positioning:
    type: object
    description: 主题定位
    properties:
      main_topic:
        type: string
        description: 核心主题，阐述文章要解决的问题或传达的观点（200-300 字）
      target_audience:
        type: string
        description: 目标读者描述，包括年龄段、知识水平、兴趣领域（100-150 字）
      value_proposition:
        type: string
        description: 价值主张，说明文章的独特价值（100-150 字）
      use_cases:
        type: array
        description: 应用场景列表
        items:
          type: string
          description: 单个应用场景（50-80 字）
  content_structure:
    type: array
    description: 内容结构（建议 5-8 个部分）
    items:
      type: object
      properties:
        title:
          type: string
          description: 部分标题
        key_points:
          type: array
          description: 核心要点列表（3-5 个）
          items:
            type: string
        word_count:
          type: string
          description: 预期字数范围
        materials_needed:
          type: array
          description: 素材需求列表
          items:
            type: string
  argument_structure:
    type: object
    description: 论述架构
    properties:
      hook:
        type: string
        description: 开篇钩子（问题引入 + 重要性 + 收获）
      body:
        type: string
        description: 主体论述（逻辑结构 + 论证方式）
      conclusion:
        type: string
        description: 结尾收束（总结 + 行动建议 + 延伸思考）
  style:
    type: object
    description: 风格设定
    properties:
      tone:
        type: string
        description: 整体基调，例如 专业/轻松/温暖/犀利
      expression:
        type: string
        description: 表达方式，例如 学术型/教程型/评论型/故事型
      length:
        type: string
        description: 篇幅控制，例如 短篇/中篇/长篇
  constraints:
    type: object
    description: 约束条件
    properties:
      quality_requirements:
        type: array
        description: 质量要求列表
        items:
          type: string
      platform:
        type: string
        description: 发布平台及格式要求
      forbidden_elements:
        type: array
        description: 禁止出现的内容列表
        items:
          type: string

required:
  - title
  - topic_positioning
  - content_structure
  - argument_structure
  - style
  - constraints
