type: object
description: >
  约束 LLM 输出为标准资源操作 YAML 结构（Video - 视频制作脚本）。
  用于指导视频脚本内容的生成。
  ⚠️ 本阶段产出为视频脚本文件（Markdown 格式），而非视频文件本身。
  ⚠️ 顶层必须为 type=resource，且仅允许声明 resources 列表。
  ⚠️ 所有长文本字段（如 content）必须使用 YAML 多行块格式：
  示例：
  content: |
    # 场景 001：开场介绍
    
    ## 基本信息
    - 时长：30 秒
    - 景别：中景→特写
  
  ❌ 禁止使用双引号 " 包裹长文本
additionalProperties: false
required:
  - type
  - resources

properties:
  type:
    type: string
    const: resource
    description: 操作类型（固定为 resource）
  resources:
    type: array
    minItems: 1
    description: 资源操作列表
    items:
      type: object
      additionalProperties: false
      required:
        - path
        - type
      properties:
        path:
          type: string
          minLength: 1
          description: 资源路径（必填）
          examples:
            - dist/scripts/001-intro-scene.md
            - dist/scripts/002-main-content.md
        type:
          type: string
          enum: [ file, directory ]
          default: file
          description: 资源类型（默认 file）
        action:
          type: string
          enum: [ create_dir, create_empty_file, write_content ]
          default: create_empty_file
          description: 操作类型（默认 create_empty_file）
        content:
          type: string
          minLength: 1
          description: |
            写入内容（仅 write_content 时必需）
            
            视频脚本内容应包含：
            - 场景标题和编号
            - 基本信息（时长、景别、类型等）
            - 画面描述（分镜细节）
            - 音频设计（BGM、配音、音效）
            - 备注说明（可选）
          examples:
            - |
              # 场景 001：开场介绍
              
              ## 基本信息
              - 时长：30 秒
              - 景别：中景→特写
              - 类型：开场钩子
              
              ## 画面描述
              [0-5 秒] 黑屏，白色文字浮现："你是否曾经……"
              [5-15 秒] 镜头缓慢推进，主讲人出现在画面中央
              
              ## 音频
              - BGM：轻柔的钢琴曲，音量渐强
              - 配音："你是否曾经想过……"（温暖、亲切）
              - 音效：文字出现时的轻微提示音
              
              ## 备注
              注意语速控制，保持悬念
