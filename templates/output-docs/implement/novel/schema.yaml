type: object
description: >
  约束 LLM 输出为标准资源操作 YAML 结构。
  顶层必须为 type=resource，且仅允许声明 resources 列表。
  ⚠️ 所有长文本字段（如 summary、background 等）必须使用 YAML 多行块格式：
  示例：
  summary: |
    这里是第一行
    这里是第二行
  ❌ 禁止使用双引号 " 包裹长文本
additionalProperties: false
required:
  - type
  - resources

properties:
  type:
    type: string
    const: resource
    description: 操作类型（固定为 resource）
  resources:
    type: array
    minItems: 1
    description: 资源操作列表
    items:
      type: object
      additionalProperties: false
      required:
        - path
        - type
      properties:
        path:
          type: string
          minLength: 1
          description: 资源路径（必填）
        type:
          type: string
          enum: [ file, directory ]
          default: file
          description: 资源类型（默认 file）
        action:
          type: string
          enum: [ create_dir, create_empty_file, write_content ]
          default: create_empty_file
          description: 操作类型（默认 create_empty_file）
        content:
          type: string
          minLength: 1
          description: 写入内容（仅 write_content 时必须）