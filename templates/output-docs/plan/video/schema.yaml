type: object
description: >
  视频创作计划（Plan）。
  用于定义视听策略、镜头语言和制作原则。
  ⚠️ 本文档为"策略层"，不得包含具体镜头、画面或细节描写。
  ⚠️ 所有长文本字段必须使用 YAML 多行块格式。

required:
  - title
  - audio_visual_intent
  - narrative_strategy
  - pacing_system
  - camera_language
  - lighting_color
  - sound_design
  - editing_principles
  - risks
  - consistency_rules
  - project_structure

properties:
  title:
    type: string
    description: 视频标题，与 Spec 保持一致
  status:
    type: string
    description: 文档状态，如 Draft / Final
  version:
    type: string
    description: 文档版本号
  audio_visual_intent:
    type: object
    description: 视听意图模块
    required: [ theme, expression, audience_experience ]
    properties:
      theme:
        type: string
        description: 核心视听主题
      expression:
        type: string
        description: 主题的表达方式
      audience_experience:
        type: string
        description: 目标观众视听体验
  narrative_strategy:
    type: object
    description: 全局叙事策略
    required: [ structure_type, conflict_escalation, suspense_strategy ]
    properties:
      structure_type:
        type: string
        description: 视频推进结构
      conflict_escalation:
        type: string
        description: 冲突升级机制
      suspense_strategy:
        type: string
        description: 悬念与反转策略
  pacing_system:
    type: object
    description: 节奏控制体系
    required: [ shot_density, climax_design, emotion_flow ]
    properties:
      shot_density:
        type: string
        description: 镜头密度分布
      climax_design:
        type: string
        description: 高潮场景设计原则
      emotion_flow:
        type: string
        description: 情绪切换节奏
  camera_language:
    type: object
    description: 镜头语言系统
    required: [ shot_sizes, camera_movement, perspective_switching ]
    properties:
      shot_sizes:
        type: string
        description: 景别使用规则
      camera_movement:
        type: string
        description: 镜头运动原则
      perspective_switching:
        type: string
        description: 视角切换策略
  lighting_color:
    type: object
    description: 光线与色彩策略
    required: [ lighting_design, color_grading, special_effects ]
    properties:
      lighting_design:
        type: string
        description: 光线设计原则
      color_grading:
        type: string
        description: 色彩分级方案
      special_effects:
        type: string
        description: 特殊光效使用
  sound_design:
    type: object
    description: 声音设计策略
    required: [ bgm_usage, sfx_design, voice_over ]
    properties:
      bgm_usage:
        type: string
        description: BGM 使用规则
      sfx_design:
        type: string
        description: 音效设计原则
      voice_over:
        type: string
        description: 配音处理策略
  editing_principles:
    type: array
    description: 剪辑决策原则列表
    items:
      type: string
  risks:
    type: array
    description: 风险与问题预判
    items:
      type: object
      required: [ problem, cause, solution ]
      properties:
        problem:
          type: string
        cause:
          type: string
        solution:
          type: string
  consistency_rules:
    type: object
    description: 一致性约束规则
    required: [ visual, audio, narrative ]
    properties:
      visual:
        type: string
        description: 视觉风格一致性
      audio:
        type: string
        description: 音频风格一致性
      narrative:
        type: string
        description: 叙事逻辑一致性
  project_structure:
    type: object
    description: 视频整体结构设计
    required:
      - videos
      - information_architecture
      - audio_visual_modules
    properties:
      videos:
        type: array
        description: 视频列表
        items:
          type: object
          required: [ index, slug, title ]
          properties:
            index:
              type: integer
              minimum: 1
            slug:
              type: string
              description: 视频英文短标识
            title:
              type: string
              description: 视频完整标题
      information_architecture:
        type: object
        required: [ distribution, early_info, late_info ]
        properties:
          distribution:
            type: string
          early_info:
            type: string
          late_info:
            type: string
      audio_visual_modules:
        type: array
        description: 可复用视听结构模块
        items:
          type: string
