type: object
description: >
  文章创作计划（Plan）。
  用于定义内容策略、结构设计和写作原则。
  ⚠️ 本文档为"策略层"，不得包含具体段落、内容或细节描写。
  ⚠️ 所有长文本字段（如 summary、background 等）必须使用 YAML 多行块格式：
  
  示例：
  
  summary: |
    这里是第一行
    这里是第二行
  
  ❌ 禁止使用双引号 " 包裹长文本

required:
  - title
  - content_intent
  - expression_strategy
  - pacing_system
  - argument_system
  - material_strategy
  - writing_principles
  - risks
  - consistency_rules
  - project_structure

properties:

  title:
    type: string
    description: >
      文章标题。应与 Spec 保持一致，不得新增或修改。

  status:
    type: string
    description: >
      文档状态，如 Draft / Final。

  version:
    type: string
    description: >
      文档版本号，例如 1.0。

  content_intent:
    type: object
    description: >
      内容意图模块。说明作品"为什么存在"以及"想表达什么"，
      从目标与读者体验角度进行抽象描述，不得复述具体内容。
    required: [ goal, expression, reader_experience ]
    properties:

      goal:
        type: string
        description: >
          核心目标（如传播知识/改变认知/促进行动等）。
          要抽象总结，不得描述具体段落或内容。

      expression:
        type: string
        description: >
          目标的表达方式。
          说明如何通过"表达方式/论述设计/素材选择"体现目标，
          使用策略性描述，而不是内容细节。

      reader_experience:
        type: string
        description: >
          目标读者体验（如收获感、认同感、行动力等）。
          应描述认知或行为变化趋势，而非具体桥段。

  expression_strategy:
    type: object
    description: >
      全局表达策略。从方法论角度说明内容如何被构建，
      不得出现具体内容或案例描述。
    required: [ structure_type, argument_reinforcement, evidence_usage ]
    properties:

      structure_type:
        type: string
        description: >
          内容推进结构（如总分总/问题解决方案/对比论证等）。
          需说明选择该结构的原因及其优势。

      argument_reinforcement:
        type: string
        description: >
          论点强化机制。
          描述论点如何逐步增强（如"从理论到实践"），
          禁止写具体论点内容。

      evidence_usage:
        type: string
        description: >
          案例与数据使用原则。
          说明频率、位置和作用，而不是具体内容。

  pacing_system:
    type: object
    description: >
      节奏控制体系。描述如何控制整体节奏变化，
      不得涉及具体段落或内容。
    required: [ information_density, emphasis_methods, reading_flow ]
    properties:

      information_density:
        type: string
        description: >
          信息密度分布。
          说明在什么情况下加密或稀释（如重点部分加密）。

      emphasis_methods:
        type: string
        description: >
          重点强调方式。
          说明如何突出关键信息（如小标题/加粗/独立段落）。

      reading_flow:
        type: string
        description: >
          阅读体验节奏。
          说明高潮点、休息点、互动点的安排原则。

  argument_system:
    type: object
    description: >
      论述驱动机制。从系统角度描述论述如何展开，
      不得重复论点或论据。
    required: [ development_method, evidence_selection, quality_assurance ]
    properties:

      development_method:
        type: string
        description: >
          论点展开方式（如并列/递进/对比）。
          描述展开的"方式与路径"，不得写具体论点。

      evidence_selection:
        type: string
        description: >
          论据选择原则（如数据优先/案例支撑/权威引用）。

      quality_assurance:
        type: string
        description: >
          论证质量保障（如逻辑链条完整/考虑反例）。

  material_strategy:
    type: object
    description: >
      素材使用策略。说明素材如何服务于内容，
      不得复述素材细节。
    required: [ priority_types, presentation_methods, verification_strategy ]
    properties:

      priority_types:
        type: string
        description: >
          素材类型优先级（如一手数据/权威引用/真实案例）。

      presentation_methods:
        type: string
        description: >
          素材呈现方式（如图表/引述/故事化）。

      verification_strategy:
        type: string
        description: >
          素材验证策略（来源交叉验证、时效性检查）。

  writing_principles:
    type: array
    description: >
      写作决策原则列表。
      每条必须是"可执行规则"，用于指导写作判断。
    items:
      type: string
      description: >
        一条明确的写作规则（如"每一段必须服务核心论点"）。

  risks:
    type: array
    description: >
      风险与问题预判。
      必须列出潜在结构性问题，并提供解决方案。
    items:
      type: object
      required: [ problem, cause, solution ]
      properties:

        problem:
          type: string
          description: >
            潜在问题（如论证不充分/案例不匹配）。

        cause:
          type: string
          description: >
            问题产生的原因（结构或策略层面）。

        solution:
          type: string
          description: >
            对应解决策略，必须具体且可执行。

  consistency_rules:
    type: object
    description: >
      全局一致性约束规则，用于保证作品稳定性。
    required: [ viewpoint, style, source_reliability ]
    properties:

      viewpoint:
        type: string
        description: >
          观点一致性规则（如前后不矛盾）。

      style:
        type: string
        description: >
          风格一致性规则（语气、表达方式统一）。

      source_reliability:
        type: string
        description: >
          信息来源可靠性规则（如必须来自权威渠道）。

  project_structure:
    type: object
    description: >
      文章整体结构设计（架构层）。
      用于定义文章的分层策略、段落组织、信息架构与论述模块。
      ⚠️ 此处仅为结构策略层，不得包含具体内容、段落文本或细节描写。
      ⚠️ 可用于 LLM 指导生成文章文件、文件树及内容模板。
    required:
      - articles
      - information_architecture
      - argument_modules
    properties:
      articles:
        type: array
        description: >
          文章列表，按索引顺序排列，每个文章生成单独文件。
          文件名格式为 "001-article-slug.md"，slug 为英文短标识。
        minItems: 1
        items:
          type: object
          required: [ index, slug, title ]
          properties:
            index:
              type: integer
              minimum: 1
              description: 文章顺序号，从 1 开始
            slug:
              type: string
              description: 文章英文短标识，用于文件名
            title:
              type: string
              description: 文章完整标题

      information_architecture:
        type: object
        description: >
          信息架构设计。
          指导 LLM 如何分布信息、设置前期与后期揭示。
        required: [ distribution, early_info, late_info ]
        properties:
          distribution:
            type: string
            description: >
              信息整体分布策略（均衡/前期密集/高潮集中等）。
          early_info:
            type: string
            description: >
              必须在前期揭示的信息类型（如核心问题、背景）。
          late_info:
            type: string
            description: >
              延迟揭示的信息类型（如深度分析、延伸思考）。

      argument_modules:
        type: array
        description: >
          可复用论述结构模块。
          用于指导 LLM 构建段落或论述模板。
          例如："观点→论据→分析→小结"、"问题→原因→方案→案例"。
        items:
          type: string
